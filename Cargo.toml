[package]
name = "jaka_roplat_multilang"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[dependencies]
anyhow = "1.0"
libjaka = { path = "../../libjaka-rs" }
robot_behavior = "0.5.4"
roplat = { path = "../../../roplat/roplat" }
rsbullet = { path = "../../rsbullet/rsbullet" }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
roplat_build = { path = "../../../roplat/roplat_build" }
